name: trade

# =============================================================================
# ARCHIVED - this workflow does not run on a schedule any more.
#
# WHY. Bybit fronts its API with CloudFront and geo-blocks the country
# GitHub's runners sit in. Measured, not guessed: the runner reported
# `Azure Region: eastus`, an IP in Virginia, and all three Bybit hosts
# returned 403 "configured to block access from your country" on a public,
# unauthenticated endpoint. No key, permission or retry changes that, and the
# region of a standard hosted runner cannot be chosen on a free plan.
#
# This used to carry `schedule: - cron: "*/5 * * * *"`, which kept firing from
# the default branch and failing 403 every time. The bot runs from a laptop
# instead - see run.py and the README.
#
# The file is kept, not deleted, because it works unchanged on a machine in a
# country Bybit serves. `workflow_dispatch` is left in place so it can still
# be started by hand from the Actions tab.
#
# TO REACTIVATE, two things, not one:
#
#   1. Put the schedule back:
#          on:
#            schedule:
#              - cron: "*/5 * * * *"
#            workflow_dispatch:
#      GitHub only honours a cron that sits on the DEFAULT branch, and treats
#      it as best effort: runs are routinely late and get dropped entirely
#      under load. The bot copes (state lives on the exchange, signals scan a
#      window of bars), but do not expect even spacing.
#
#   2. !!! UPDATE THE env: BLOCK BELOW - IT IS OUT OF DATE !!!
#      It still passes SMA_FAST_PERIOD and SMA_SLOW_PERIOD, which were
#      retired, and it knows NONE of the settings added in commit 4055141:
#      ACTIVE_STRATEGIES, MIN_ENTRY_VOTES, MAX_OPEN_POSITIONS, REGIME_FILTER,
#      REGIME_PERIOD, EXIT_ON_REGIME_BREAK, UNKNOWN_OWNER_EXIT,
#      EMA_FAST_PERIOD, EMA_SLOW_PERIOD, ADX_PERIOD, ADX_MIN,
#      MEANREV_EXIT_SMA_PERIOD, BREAKOUT_EXIT_LOOKBACK, RISK_MODEL,
#      ATR_PERIOD, ATR_STOP_MULT, ATR_TARGET_MULT, ATR_TRAIL_MULT,
#      ATR_TRAIL_ACTIVATION_MULT.
#
#      Started as-is today, the bot would run on half a configuration: the
#      repository Variables for everything missing would never reach it, and
#      it would silently fall back to the defaults in config.py. Compare the
#      list against .env.example, which is the complete control panel, BEFORE
#      you run this.
# =============================================================================

on:
  workflow_dispatch:

# Never let two runs trade at the same time.
concurrency:
  group: trade
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Carries the "which closes were already pushed" file between runs, so a
      # close is announced once instead of on every run inside the lookback
      # window. Purely cosmetic - a cache miss costs a duplicate notification,
      # never a duplicate trade.
      - name: Restore notification state
        uses: actions/cache@v4
        with:
          path: state
          key: notified-${{ github.run_id }}
          restore-keys: |
            notified-

      - name: Run bot
        env:
          # Secrets. Never echoed: the code prints neither keys nor the topic.
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

          # Repository Variables. Anything left unset falls back to the value
          # in config.py, so you can retune without committing code.
          DUMMY_MODE: ${{ vars.DUMMY_MODE }}
          SYMBOLS: ${{ vars.SYMBOLS }}
          STRATEGY: ${{ vars.STRATEGY }}
          POSITION_NOTIONAL_USDT: ${{ vars.POSITION_NOTIONAL_USDT }}
          LEVERAGE: ${{ vars.LEVERAGE }}
          STOP_LOSS_PCT: ${{ vars.STOP_LOSS_PCT }}
          TAKE_PROFIT_PCT: ${{ vars.TAKE_PROFIT_PCT }}
          TRAILING_STOP_PCT: ${{ vars.TRAILING_STOP_PCT }}
          TRAILING_ACTIVATION_PCT: ${{ vars.TRAILING_ACTIVATION_PCT }}
          ENTRY_TIMEFRAME: ${{ vars.ENTRY_TIMEFRAME }}
          EXIT_TIMEFRAME: ${{ vars.EXIT_TIMEFRAME }}
          SIGNAL_LOOKBACK_BARS: ${{ vars.SIGNAL_LOOKBACK_BARS }}
          SMA_FAST_PERIOD: ${{ vars.SMA_FAST_PERIOD }}
          SMA_SLOW_PERIOD: ${{ vars.SMA_SLOW_PERIOD }}
          RSI_PERIOD: ${{ vars.RSI_PERIOD }}
          RSI_OVERSOLD: ${{ vars.RSI_OVERSOLD }}
          RSI_OVERBOUGHT: ${{ vars.RSI_OVERBOUGHT }}
          BREAKOUT_LOOKBACK: ${{ vars.BREAKOUT_LOOKBACK }}
          CLOSED_LOOKBACK_MINUTES: ${{ vars.CLOSED_LOOKBACK_MINUTES }}

          # Lets signals.py tell a manual run apart from a cron run, which is
          # what dummy_mode keys off.
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python main.py
